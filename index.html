<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok Image Generator</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 600px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-top: 0; color: #38bdf8; }
        .group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input[type="password"], textarea, select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        textarea { resize: vertical; height: 100px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .result-box { margin-top: 20px; text-align: center; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; border-radius: 8px; border: 1px dashed #334155; padding: 15px; }
        img { max-width: 100%; height: auto; border-radius: 8px; display: none; margin-bottom: 15px; }
        .loading { display: none; color: #38bdf8; font-weight: bold; }
        .download-btn { display: none; background: #10b981; margin-top: 10px; text-decoration: none; padding: 10px 20px; color: white; border-radius: 6px; font-weight: bold; }
        .download-btn:hover { background: #059669; }
    </style>
</head>
<body>

<div class="container">
    <h2>Grok Image Generator</h2>
    
    <div class="group">
        <label for="apiKey">xAI (Grok) API Key:</label>
        <input type="password" id="apiKey" placeholder="xai-xxxxxxxxxxxxxxxx">
    </div>

    <div class="group">
        <label for="prompt">Prompt (คำอธิบายภาพ):</label>
        <textarea id="prompt" placeholder="A futuristic city at sunset, highly detailed, 8k resolution..."></textarea>
    </div>

    <div class="group">
        <label for="aspectRatio">Aspect Ratio (สัดส่วนภาพ):</label>
        <select id="aspectRatio">
            <option value="1:1">1:1 (สี่เหลี่ยมจัตุรัส)</option>
            <option value="16:9">16:9 (แนวนอน)</option>
            <option value="9:16">9:16 (แนวตั้ง)</option>
            <option value="4:3">4:3</option>
            <option value="3:4">3:4</option>
        </select>
    </div>

    <button id="generateBtn" onclick="generateImage()">สร้างภาพ (Generate)</button>

    <div class="result-box">
        <div id="loading" class="loading">กำลังเจนภาพ... กรุณารอสักครู่</div>
        <img id="resultImage" alt="Generated Image">
        <a id="downloadLink" class="download-btn" target="_blank">ดาวน์โหลดภาพ</a>
    </div>
</div>

<script>
    // โหลด API Key จาก LocalStorage ถ้ามีบันทึกไว้
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("grok_api_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
        }
    });

    async function generateImage() {
        const apiKey = document.getElementById("apiKey").value.trim();
        const prompt = document.getElementById("prompt").value.trim();
        const aspectRatio = document.getElementById("aspectRatio").value;
        const btn = document.getElementById("generateBtn");
        const loading = document.getElementById("loading");
        const img = document.getElementById("resultImage");
        const downloadLink = document.getElementById("downloadLink");

        if (!apiKey) {
            alert("กรุณากรอก API Key ก่อนใช้งานครับ");
            return;
        }
        if (!prompt) {
            alert("กรุณากรอก Prompt ก่อนครับ");
            return;
        }

        // บันทึก Key ลงในเครื่องใช้งานคนเดียว
        localStorage.setItem("grok_api_key", apiKey);

        // UI Reset
        btn.disabled = true;
        loading.style.display = "block";
        img.style.display = "none";
        downloadLink.style.display = "none";

        try {
            const response = await fetch("https://api.x.ai/v1/images/generations", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "grok-2-image", // หากมีอัปเดตสามารถเปลี่ยนเป็น grok-3-image ได้
                    prompt: prompt,
                    aspect_ratio: aspectRatio,
                    n: 1
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || "เกิดข้อผิดพลาดในการดึงข้อมูล");
            }

            // แสดงผลภาพ
            const imageUrl = data.data[0].url;
            img.src = imageUrl;
            img.style.display = "block";

            downloadLink.href = imageUrl;
            downloadLink.download = "grok-generated-image.png";
            downloadLink.style.display = "inline-block";

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.disabled = false;
            loading.style.display = "none";
        }
    }
</script>

</body>
</html>
